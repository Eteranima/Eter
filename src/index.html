<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Éter Anima — Stone Reach Academy</title>
<link rel="stylesheet" href="styles/game.css">
</head>
<body>
<div id="stage"><canvas id="game-canvas" width="800" height="600"></canvas></div>
<div id="hint">setas/WASD mover · Z confirmar · X cancelar · C menu · M mapa · TAB alternar time · N som</div>
<div id="btn-full" title="Tela cheia">⛶</div>
<!-- Só aparece em eterhml.denverso.com (ver scripts/39-build-badge.js). O
     texto do carimbo é escrito por tools/construir_modular.py a cada build;
     em src/ crua ele fica com o marcador abaixo, sem efeito nenhum. -->
<div id="build-badge" aria-hidden="true">build __BUILD_TIMESTAMP__</div>

<div id="mobile-controls">
  <div class="dpad">
    <div class="pad blank"></div><div class="pad" data-dir="up" role="button" tabindex="0" aria-label="Mover para cima">▲</div><div class="pad blank"></div>
    <div class="pad" data-dir="left" role="button" tabindex="0" aria-label="Mover para esquerda">◄</div><div class="pad blank"></div><div class="pad" data-dir="right" role="button" tabindex="0" aria-label="Mover para direita">►</div>
    <div class="pad blank"></div><div class="pad" data-dir="down" role="button" tabindex="0" aria-label="Mover para baixo">▼</div><div class="pad blank"></div>
  </div>
  <div class="act-col">
    <div class="act-row">
      <div class="act sm" data-btn="menu" role="button" tabindex="0" aria-label="Abrir menu">MENU</div>
      <div class="act sm" data-btn="swap" role="button" tabindex="0" aria-label="Alternar time">TROCA</div>
    </div>
    <div class="act-row">
      <div class="act cancel sm" data-btn="cancel" role="button" tabindex="0" aria-label="Cancelar">X</div>
      <div class="act confirm" data-btn="confirm" role="button" tabindex="0" aria-label="Confirmar">Z</div>
    </div>
  </div>
</div>
